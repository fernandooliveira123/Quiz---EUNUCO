<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10b981" flood-opacity="0.6" />
    </filter>
  </defs>
  
  <!-- Fundo do Ícone estilo App Moderno -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Haltere com estética Treino Inteligente -->
  <g filter="url(#glow)">
    <!-- Barra Central -->
    <rect x="20" y="29.5" width="24" height="5" rx="2.5" fill="url(#glowGrad)" />
    
    <!-- Anilha Esquerda Interna -->
    <rect x="14" y="19" width="6" height="26" rx="3" fill="url(#glowGrad)" />
    <!-- Anilha Esquerda Externa -->
    <rect x="8" y="23" width="5" height="18" rx="2.5" fill="url(#glowGrad)" opacity="0.9" />
    
    <!-- Anilha Direita Interna -->
    <rect x="44" y="19" width="6" height="26" rx="3" fill="url(#glowGrad)" />
    <!-- Anilha Direita Externa -->
    <rect x="51" y="23" width="5" height="18" rx="2.5" fill="url(#glowGrad)" opacity="0.9" />

    <!-- Ponto Central de Conexão Inteligente -->
    <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
  </g>
</svg>
